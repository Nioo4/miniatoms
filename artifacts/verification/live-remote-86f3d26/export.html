p;\\n}\\n\\n.empty-hint {\\n  margin: 4px 0 0;\\n  padding: 18px 12px;\\n  text-align: center;\\n  font-size: 14px;\\n  color: var(--ink-soft);\\n  background: var(--surface-alt);\\n  border: 1px dashed var(--brand-line);\\n  border-radius: 12px;\\n}\\n\\n.dialog-backdrop {\\n  position: fixed;\\n  inset: 0;\\n  background: rgba(16, 32, 58, 0.45);\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  padding: 20px;\\n  z-index: 50;\\n}\\n\\n.dialog-backdrop[hidden] {\\n  display: none;\\n}\\n\\n.dialog {\\n  width: 100%;\\n  max-width: 360px;\\n  background: var(--surface);\\n  border-radius: var(--radius);\\n  border: 1px solid var(--brand-line);\\n  box-shadow: 0 18px 40px rgba(16, 32, 58, 0.28);\\n  padding: 18px;\\n}\\n\\n.dialog-title {\\n  margin: 0 0 8px;\\n  font-size: 17px;\\n  color: var(--brand-dark);\\n}\\n\\n.dialog-text {\\n  margin: 0 0 16px;\\n  font-size: 14px;\\n  color: var(--ink-soft);\\n  word-break: break-word;\\n}\\n\\n.dialog-actions {\\n  display: flex;\\n  justify-content: flex-end;\\n  gap: 10px;\\n}\\n\\n@media (max-width: 520px) {\\n  .app-shell {\\n    padding: 16px 12px 40px;\\n  }\\n\\n  .app-title {\\n    font-size: 21px;\\n  }\\n\\n  .record-form {\\n    grid-template-columns: minmax(0, 1fr);\\n  }\\n\\n  .stats-grid {\\n    grid-template-columns: repeat(2, minmax(0, 1fr));\\n  }\\n\\n  .btn {\\n    padding: 10px 14px;\\n  }\\n}\",\"js\":\"const STAGES = [\\n  { key: 'pending', label: '待投递' },\\n  { key: 'applied', label: '已投递' },\\n  { key: 'interview', label: '面试中' },\\n  { key: 'closed', label: '已结束' }\\n];\\nconst STAGE_LABEL = STAGES.reduce((acc, s) => { acc[s.key] = s.label; return acc; }, {});\\nconst STAGE_KEYS = STAGES.map((s) => s.key);\\n\\nconst state = {\\n  records: [],\\n  filter: 'all',\\n  editingId: null,\\n  pendingDeleteId: null\\n};\\n\\nconst el = {\\n  stats: document.querySelector('[data-stats]'),\\n  totalLine: document.querySelector('[data-total-line]'),\\n  form: document.querySelector('[data-record-form]'),\\n  formTitle: document.querySelector('[data-form-title]'),\\n  formError: document.querySelector('[data-form-error]'),\\n  submitBtn: document.querySelector('[data-submit-btn]'),\\n  cancelEdit: document.querySelector('[data-cancel-edit]'),\\n  company: document.querySelector('#field-company'),\\n  position: document.querySelector('#field-position'),\\n  applyDate: document.querySelector('#field-date'),\\n  stage: document.querySelector('#field-stage'),\\n  note: document.querySelector('#field-note'),\\n  list: document.querySelector('[data-record-list]'),\\n  listCount: document.querySelector('[data-list-count]'),\\n  emptyHint: document.querySelector('[data-empty-hint]'),\\n  filterBar: document.querySelector('.filter-bar'),\\n  dialog: document.querySelector('[data-dialog]'),\\n  dialogTitle: document.querySelector('[data-dialog-title]'),\\n  dialogText: document.querySelector('[data-dialog-text]'),\\n  dialogCancel: document.querySelector('[data-dialog-cancel]'),\\n  dialogConfirm: document.querySelector('[data-dialog-confirm]')\\n};\\n\\nfunction normalizeStage(value) {\\n  return STAGE_KEYS.indexOf(value) >= 0 ? value : 'pending';\\n}\\n\\nfunction normalizeRecord(raw) {\\n  const source = raw && typeof raw === 'object' ? raw : {};\\n  const record = Object.assign({}, source);\\n  record.id = typeof source.id === 'string' && source.id ? source.id : 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);\\n  record.company = typeof source.company === 'string' ? source.company : '';\\n  record.position = typeof source.position === 'string' ? source.position : '';\\n  record.applyDate = typeof source.applyDate === 'string' ? source.applyDate : '';\\n  record.stage = normalizeStage(source.stage);\\n  record.note = typeof source.note === 'string' ? source.note : '';\\n  if (typeof record.createdAt !== 'number') record.createdAt = Date.now();\\n  return record;\\n}\\n\\nfunction todayString() {\\n  const d = new Date();\\n  const m = String(d.getMonth() + 1).padStart(2, '0');\\n  const day = String(d.getDate()).padStart(2, '0');\\n  return d.getFullYear() + '-' + m + '-' + day;\\n}\\n\\nfunction formatDate(value) {\\n  if (!value) return '未填写';\\n  const parts = String(value).split('-');\\n  if (parts.length === 3) return parts[0] + '年' + Number(parts[1]) + '月' + Number(parts[2]) + '日';\\n  return value;\\n}\\n\\nfunction countByStage() {\\n  const counts = { all: state.records.length };\\n  STAGE_KEYS.forEach((key) => { counts[key] = 0; });\\n  state.records.forEach((record) => {\\n    const key = normalizeStage(record.stage);\\n    counts[key] += 1;\\n  });\\n  return counts;\\n}\\n\\nfunction visibleRecords() {\\n  if (state.filter === 'all') return state.records.slice();\\n  return state.records.filter((record) => normalizeStage(record.stage) === state.filter);\\n}\\n\\nfunction renderStats() {\\n  const counts = countByStage();\\n  el.stats.textContent = '';\\n  const cards = [{ key: 'all', label: '全部' }].concat(STAGES);\\n  cards.forEach((card) => {\\n    const btn = document.createElement('button');\\n    btn.type = 'button';\\n    btn.className = 'stat-card' + (state.filter === card.key ? ' is-active' : '');\\n    btn.setAttribute('data-stat', card.key);\\n\\n    const label = document.createElement('span');\\n    label.className = 'stat-label';\\n    label.textContent = card.label;\\n\\n    const value = document.createElement('span');\\n    value.className = 'stat-value';\\n    value.textContent = String(counts[card.key] || 0);\\n\\n    btn.appendChild(label);\\n    btn.appendChild(value);\\n    el.stats.appendChild(btn);\\n  });\\n\\n  const parts = STAGES.map((s) => s.label + ' ' + (counts[s.key] || 0)).join(' · ');\\n  el.totalLine.textContent = '共 ' + counts.all + ' 条记录（' + parts + '）';\\n}\\n\\nfunction renderFilters() {\\n  const chips = el.filterBar.querySelectorAll('[data-filter]');\\n  Array.prototype.forEach.call(chips, (chip) => {\\n    const key = chip.getAttribute('data-filter');\\n    chip.classList.toggle('is-active', key === state.filter);\\n  });\\n}\\n\\nfunction buildRecordItem(record) {\\n  const li = document.createElement('li');\\n  li.className = 'record-item';\\n  li.setAttribute('data-id', record.id);\\n\\n  const top = document.createElement('div');\\n  top.className = 'record-top';\\n\\n  const titleWrap = document.createElement('div');\\n  const company = document.createElement('p');\\n  company.className = 'record-company';\\n  company.textContent = record.company || '（未填写公司）';\\n  const position = document.createElement('p');\\n  position.className = 'record-position';\\n  position.textContent = record.position || '（未填写岗位）';\\n  titleWrap.appendChild(company);\\n  titleWrap.appendChild(position);\\n\\n  const stageKey = normalizeStage(record.stage);\\n  const badge = document.createElement('span');\\n  badge.className = 'stage-badge stage-' + stageKey;\\n  badge.textContent = STAGE_LABEL[stageKey];\\n\\n  top.appendChild(titleWrap);\\n  top.appendChild(badge);\\n\\n  const meta = document.createElement('div');\\n  meta.className = 'record-meta';\\n  const dateSpan = document.createElement('span');\\n  dateSpan.textContent = '投递日期：' + formatDate(record.applyDate);\\n  meta.appendChild(dateSpan);\\n\\n  li.appendChild(top);\\n  li.appendChild(meta);\\n\\n  if (record.note) {\\n    const note = document.createElement('p');\\n    note.className = 'record-note';\\n    note.textContent = record.note;\\n    li.appendChild(note);\\n  }\\n\\n  const actions = document.createElement('div');\\n  actions.className = 'record-actions';\\n\\n  const editBtn = document.createElement('button');\\n  editBtn.type = 'button';\\n  editBtn.className = 'btn btn-ghost btn-small';\\n  editBtn.setAttribute('data-action', 'edit');\\n  editBtn.setAttribute('data-id', record.id);\\n  editBtn.textContent = '编辑';\\n\\n  const delBtn = document.createElement('button');\\n  delBtn.type = 'button';\\n  delBtn.className = 'btn btn-danger btn-small';\\n  delBtn.setAttribute('data-action', 'delete');\\n  delBtn.setAttribute('data-id', record.id);\\n  delBtn.textContent = '删除';\\n\\n  actions.appendChild(editBtn);\\n  actions.appendChild(delBtn);\\n  li.appendChild(actions);\\n\\n  return li;\\n}\\n\\nfunction renderList() {\\n  const records = visibleRecords();\\n  el.list.textContent = '';\\n  records.forEach((record) => {\\n    el.list.appendChild(buildRecordItem(record));\\n  });\\n\\n  const total = state.records.length;\\n  el.listCount.textContent = state.filter === 'all'\\n    ? total + ' 条'\\n    : records.length + ' / ' + total + ' 条';\\n\\n  if (records.length === 0) {\\n    el.emptyHint.hidden = false;\\n    el.emptyHint.textContent = total === 0\\n      ? '还没有投递记录，先在上方添加第一条吧。'\\n      : '当前筛选（' + STAGE_LABEL[state.filter] + '）下没有记录。';\\n  } else {\\n    el.emptyHint.hidden = true;\\n    el.emptyHint.textContent = '';\\n  }\\n}\\n\\nfunction render() {\\n  renderStats();\\n  renderFilters();\\n  renderList();\\n}\\n\\nfunction showFormError(message) {\\n  if (message) {\\n    el.formError.textContent = message;\\n    el.formError.hidden = false;\\n  } else {\\n    el.formError.textContent = '';\\n    el.formError.hidden = true;\\n  }\\n}\\n\\nfunction resetForm() {\\n  state.editingId = null;\\n  el.form.reset();\\n  el.applyDate.value = todayString();\\n  el.stage.value = 'pending';\\n  el.formTitle.textContent = '新增投递记录';\\n  el.submitBtn.textContent = '保存记录';\\n  el.cancelEdit.hidden = true;\\n  showFormError('');\\n}\\n\\nfunction fillForm(record) {\\n  state.editingId = record.id;\\n  el.company.value = record.company;\\n  el.position.value = record.position;\\n  el.applyDate.value = record.applyDate;\\n  el.stage.value = normalizeStage(record.stage);\\n  el.note.value = record.note;\\n  el.formTitle.textContent = '编辑投递记录';\\n  el.submitBtn.textContent = '保存修改';\\n  el.cancelEdit.hidden = false;\\n  showFormError('');\\n}\\n\\nasync function persist(nextRecords) {\\n  const current = await appStore.getState();\\n  const next = Object.assign({}, current, { records: nextRecords });\\n  await appStore.setState(next);\\n}\\n\\nasync function handleSubmit(event) {\\n  event.preventDefault();\\n  const company = el.company.value.trim();\\n  const position = el.position.value.trim();\\n  const applyDate = el.applyDate.value;\\n  const stage = normalizeStage(el.stage.value);\\n  const note = el.note.value.trim();\\n\\n  if (!company) {\\n    showFormError('请填写公司名称。');\\n    el.company.focus();\\n    return;\\n  }\\n  if (!position) {\\n    showFormError('请填写岗位名称。');\\n    el.position.focus();\\n    return;\\n  }\\n\\n  const editingId = state.editingId;\\n  let nextRecords;\\n  if (editingId) {\\n    nextRecords = state.records.map((record) => {\\n      if (record.id !== editingId) return record;\\n      return Object.assign({}, record, {\\n        company: company,\\n        position: position,\\n        applyDate: applyDate,\\n        stage: stage,\\n        note: note\\n      });\\n    });\\n  } else {\\n    const newRecord = normalizeRecord({\\n      id: 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),\\n      company: company,\\n      position: position,\\n      applyDate: applyDate,\\n      stage: stage,\\n      note: note,\\n      createdAt: Date.now()\\n    });\\n    nextRecords = state.records.concat([newRecord]);\\n  }\\n\\n  try {\\n    await persist(nextRecords);\\n  } catch (error) {\\n    showFormError('保存失败，请重试。你的输入已保留。');\\n    return;\\n  }\\n\\n  state.records = nextRecords;\\n  resetForm();\\n  render();\\n}\\n\\nfunction openDeleteDialog(record) {\\n  state.pendingDeleteId = record.id;\\n  el.dialogTitle.textContent = '确认删除';\\n  el.dialogText.textContent = '确定要删除「' + (record.company || '未填写公司') + ' · ' + (record.position || '未填写岗位') + '」这条投递记录吗？删除后无法恢复。';\\n  el.dialog.hidden = false;\\n  el.dialogConfirm.focus();\\n}\\n\\nfunction closeDeleteDialog() {\\n  state.pendingDeleteId = null;\\n  el.dialog.hidden = true;\\n}\\n\\n
